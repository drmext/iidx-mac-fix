[dmo_stub]
log=1
enabled=1
; mode=
;   imo_fail     - stub REGDB_E_CLASSNOTREG when riid is IMediaObject (default)
;   dsfx         - stub only known DirectSound FX DMO CLSIDs (IIDX + MSDN)
;   bm2dx_fail   - stub any CoCreateInstance failure whose caller is bm2dx.dll
;   dsfx_always  - always replace DSFX creates with the stub (ignore native)
mode=imo_fail
